<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>新創競技場 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* Layout: full-screen white-model Taipei boulevard leading to Taipei 101; white glass HUD at the corners, cards open center-stage. Single white look by design. */
:root{
  --glass:rgba(255,255,255,.9); --glass2:rgba(29,34,51,.04); --line:rgba(29,34,51,.14);
  --ink:#1d2233; --muted:#5d6579; --gold:#2b6fb0; --good:#1f9a55; --bad:#d48a1f;
  --stage:#2b6fb0;
  --f-head:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Chakra Petch","Noto Sans TC",sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:#ffffff;color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

.hud{position:fixed;z-index:5;pointer-events:none}
.glass{background:var(--glass);border:1.5px solid var(--line);border-radius:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#stats{top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:7px;padding:10px 12px}
.me-chip{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:900;font-size:15px}
.me-dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--line)}
.meters{display:grid;grid-template-columns:repeat(4,auto);gap:4px 14px}
.meter{display:flex;flex-direction:column;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.meter b{display:inline-block;transform-origin:left center;font-family:var(--f-num);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.meter.bump b{animation:bump .6s}
@keyframes bump{30%{color:var(--gold);transform:scale(1.2)}}
#progress{top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:6px;padding:8px 10px;flex-wrap:wrap;justify-content:flex-end;max-width:56vw}
.pill{font-size:12px;font-weight:900;padding:4px 9px;border-radius:999px;border:1.5px solid rgba(29,34,51,.15);color:#98a0ad;font-family:var(--f-head)}
.pill.cur{color:var(--ink);border-color:var(--gold);box-shadow:0 0 10px rgba(43,111,176,.3)}
.pill.done{color:#fff;border-color:transparent}
#crosshair{left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(29,34,51,.6)}
#crosshair.on{width:22px;height:22px;margin:-11px 0 0 -11px;background:transparent;border:2.5px solid var(--gold);box-shadow:0 0 12px rgba(43,111,176,.5)}
#prompt{left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:9px 16px;font-weight:700;font-size:15px;white-space:nowrap}
#prompt kbd{display:inline-block;background:var(--gold);color:#fff;border-radius:6px;padding:0 7px;margin-right:8px;font-family:var(--f-num);font-weight:700}
#tip{left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-weight:700;font-size:14px;padding:8px 14px;max-width:calc(100vw - 32px);text-align:center}
#keys{left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);padding:7px 11px;line-height:1.75}
#keys kbd{font-family:var(--f-num);background:rgba(29,34,51,.08);color:var(--ink);border-radius:5px;padding:0 5px;margin:0 2px}
#cardBtn{pointer-events:auto;right:max(12px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px))}
#banner{left:50%;top:28%;transform:translateX(-50%);text-align:center;font-family:var(--f-head);color:var(--ink);text-shadow:0 0 18px #fff,0 0 4px #fff;opacity:0;transition:opacity .8s}
#banner.show{opacity:1}
#banner small{display:block;font-size:15px;letter-spacing:.3em;font-family:var(--f-body);font-weight:700;color:var(--muted)}
#banner b{display:block;font-size:56px;font-weight:900;letter-spacing:.12em}
#banner span{display:block;width:220px;height:2px;margin:6px auto 0;background:linear-gradient(90deg,transparent,var(--ink),transparent)}

.btn{font-family:var(--f-body);font-weight:900;font-size:16px;color:#fff;background:var(--gold);border:1.5px solid rgba(255,255,255,.6);border-radius:10px;padding:11px 18px;cursor:pointer;transition:transform .08s,box-shadow .2s}
.btn:hover{box-shadow:0 0 14px rgba(43,111,176,.35)}
.btn:active{transform:translateY(2px)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.stage{background:var(--stage);color:#fff}
.btn.small{font-size:13px;padding:6px 12px}
.row{display:flex;gap:10px;flex-wrap:wrap}

#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.6);padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#panel{position:relative;background:#ffffff;border:1.5px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(29,34,51,.16);width:100%;max-width:660px;max-height:100%;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px;-webkit-user-select:text;user-select:text;animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){#panel,.meter.bump b{animation:none}#banner{transition:none}}
.eyebrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);letter-spacing:.05em}
.tag.th{background:var(--stage);color:#fff;border-color:transparent}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3;font-family:var(--f-head)}
h1{font-size:30px;font-weight:900}
h2{font-size:24px;font-weight:900}
h3{font-size:16px;font-weight:900;color:var(--gold);letter-spacing:.04em}
p{margin:0;line-height:1.8;font-size:15px}
.muted{color:var(--muted)}
.box{background:var(--glass2);border-radius:10px;padding:12px 14px;border:1px solid rgba(29,34,51,.1)}
.box.task{border-color:rgba(43,111,176,.4);background:rgba(43,111,176,.06)}
.big-act{font-size:21px;font-weight:900;line-height:1.55;font-family:var(--f-head)}
.verdict{display:flex;align-items:center;gap:14px}
.mark{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:900;color:#fff;flex:none}
.deltas{display:flex;gap:6px;flex-wrap:wrap}
.d{font-family:var(--f-num);font-weight:700;font-size:14px;padding:3px 10px;border-radius:999px;border:1px solid rgba(29,34,51,.12)}
.d.up{color:var(--good);border-color:rgba(31,154,85,.45)}.d.down{color:var(--bad);border-color:rgba(212,138,31,.5)}
.revgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.revgrid div{font-size:13px;border:1px solid rgba(29,34,51,.12);border-radius:8px;padding:6px 9px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.revgrid i{font-style:normal;font-weight:900}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:480px}
th,td{padding:6px 7px;border-bottom:1px solid rgba(29,34,51,.1);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.ans td{background:rgba(43,111,176,.1)}
tr.mine td{box-shadow:inset 0 -2px 0 var(--bad)}
.cogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.co{border:1px solid rgba(29,34,51,.14);border-radius:12px;padding:11px;cursor:pointer;background:#fff;display:flex;flex-direction:column;gap:5px;font-family:var(--f-body);text-align:left;color:var(--ink)}
.co:hover{border-color:rgba(43,111,176,.5)}
.co:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.co.sel{border-color:var(--gold);background:rgba(43,111,176,.08);box-shadow:0 0 0 2px rgba(43,111,176,.25)}
.co .sw{height:4px;border-radius:2px}
.co b{font-size:15px;font-family:var(--f-head)}
.co small{font-size:12px;color:var(--muted);line-height:1.55}
.grade{font-family:var(--f-num);font-size:40px;font-weight:700;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 0 0 3px rgba(29,34,51,.1)}
.rank{display:flex;flex-direction:column;gap:6px}
.rank div{display:grid;grid-template-columns:30px 12px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 12px;border-radius:9px;border:1px solid rgba(29,34,51,.12)}
.rank div.me{border-color:var(--gold);background:rgba(43,111,176,.07)}
.rank .pos,.rank .sc{font-family:var(--f-num);font-size:18px;font-variant-numeric:tabular-nums}
.rank .sub{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.rank .sw{width:12px;height:12px;border-radius:50%}
.kicker{font-size:12px;font-weight:700;letter-spacing:.3em;color:var(--gold)}
@media (max-width:560px){
  .cogrid,.revgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  h1{font-size:25px}#panel{padding:18px}#keys{display:none}
  .meters{grid-template-columns:repeat(2,auto)}
  #banner b{font-size:40px}
}

#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
#joy{position:absolute;left:max(24px,calc(env(safe-area-inset-left,0px) + 16px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.55);border:1.5px solid var(--line);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(29,34,51,.25)}
.tbtn{position:absolute;pointer-events:auto;width:70px;height:70px;border-radius:50%;border:1.5px solid var(--line);font-weight:900;font-size:15px;font-family:var(--f-body);touch-action:none;color:var(--ink);background:var(--glass)}
#tAct{right:max(24px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(110px + env(safe-area-inset-bottom,0px));background:var(--gold);color:#fff}
#tJump{right:max(104px,calc(env(safe-area-inset-right,0px) + 96px));bottom:calc(32px + env(safe-area-inset-bottom,0px))}

#film{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.97);padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.film-box{width:min(100%,1000px);display:flex;flex-direction:column;gap:12px}
#filmC,#filmV{width:100%;max-width:100%;aspect-ratio:16/9;max-height:calc(100dvh - 150px);object-fit:contain;border-radius:14px;background:#000;box-shadow:0 18px 50px rgba(29,34,51,.16);display:block}
#filmV{background:#11161f}
.film-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#filmLabel{font-weight:900;font-family:var(--f-head);flex:1 1 200px;min-width:0}
.film-prog{flex:1 1 160px;height:6px;border-radius:3px;background:rgba(29,34,51,.1);overflow:hidden}
.film-prog i{display:block;height:100%;width:0;background:var(--gold)}
.txt{flex:1 1 160px;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.txt:focus{outline:2px solid var(--gold);outline-offset:1px}
.chatlog{max-height:200px;min-height:70px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--glass2)}
.msg{max-width:80%;padding:6px 11px;border-radius:12px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--gold);color:#fff}
.msg.them{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.co .taken{color:var(--bad);font-weight:700}
.co:disabled{cursor:not-allowed}
#err{position:fixed;inset:0;display:grid;place-items:center;font-weight:900;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
</style>

</head>
<body>
<canvas id="c" tabindex="0" aria-label="台北市 3D 闖關場景"></canvas>

<div class="hud glass" id="stats" hidden>
  <div class="me-chip"><span class="me-dot" id="meDot"></span><span id="meName"></span></div>

    <div class="meter" id="mCap">資本<b>6</b></div>

  </div>
</div>
<div class="hud glass" id="progress" hidden></div>
<button class="hud btn small ghost glass" id="cardBtn" hidden>事件卡 (Q)</button>
<div class="hud" id="crosshair" hidden></div>
<div class="hud glass" id="prompt" hidden></div>
<div class="hud glass" id="tip" hidden></div>

<script>
(function(){
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<div id="err">3D 引擎載入失敗，請重新整理頁面。</div>');return;}
const SANS='"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif';
const SERIF='"Noto Serif TC","Songti TC","PMingLiU",serif';
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ───────── 遊戲資料：八回合試玩草案 ───────── */
const COMP=[
 {id:'chip',  name:'AI 晶片',       short:'晶片',  color:'#3d6cf0', core:'晶片設計、運算技術', need:'硬體整合、實際應用'},
 {id:'green', name:'綠色能源',      short:'綠能',  color:'#27a854', core:'綠電、能源管理',     need:'高耗能產業、節能應用'},
 {id:'server',name:'AI 伺服器',     short:'伺服器',color:'#8551de', core:'硬體製造、系統整合', need:'晶片技術、雲端需求'},
 {id:'cloud', name:'雲端／資料中心',short:'雲端',  color:'#1599b5', core:'雲端平台、資料處理', need:'運算硬體、能源、應用場景'},
 {id:'med',   name:'智慧醫療',      short:'醫療',  color:'#c94f86', core:'醫療專業、應用需求', need:'AI 技術、資料平台、設備'},
 {id:'mfg',   name:'智慧製造',      short:'製造',  color:'#c98a2a', core:'自動化、製程整合',   need:'AI 技術、能源管理、數據分析'}
];
const CI={};COMP.forEach((c,i)=>CI[c.id]=i);
const SHUO=['效率說','資源說','競局說','風險說','生態說'];
const TH={
 '效率說':{color:'#12a3bd',desc:'用更少的投入換到更多產出：把流程、設計、排程做得更省、更快。'},
 '資源說':{color:'#d99a12',desc:'掌握別人難以取得的資源、資料或知識，並把它用在刀口上。'},
 '競局說':{color:'#86a826',desc:'看清對手與同業的動作，決定怎麼搶、怎麼守，或一起訂遊戲規則。'},
 '風險說':{color:'#4f6fd1',desc:'面對不確定，先布好備援與應變，讓關鍵營運不中斷。'},
 '生態說':{color:'#2ea866',desc:'把上下游、社區和夥伴拉進來，一起把整個生態系做大。'},
 '互賴說':{color:'#a454c6',desc:'彼此依存：找到能補足自己的夥伴，一起投入、一起分享成果。'}
};
const HAIRS=['#2a2f45','#6b4a2e','#1c1c22','#c9ced8','#7a4a30','#3d2a1d'];
const SKINS=['#f2cba5','#e8b98f','#f5d3b3','#dba57c','#f0c49c','#e3ad84'];
const RCOL={'3.0':'#2b6fb0','4.0':'#2e8a5a',coop:'#a454c6',invest:'#c7922a'};
// a：五說行動（效率、資源、競局、風險、生態）；best：主持人答案；why：理由
const R1={
 chip:{ctx:'封裝測試排隊',a:['共用已驗證的測試流程','研發下一代晶片架構','降價換更大的訂單','預留第二家尚未認證的封裝廠','發起跨廠介面標準工作組'],best:0,why:'共用已經驗證的測試流程，可減少重複設定與排隊。'},
 green:{ctx:'新案場未併網，既有電廠出力不穩',a:['改善電廠巡檢排程','培養新的發電預測團隊','轉租既有接網容量','用兩座已併網電廠交叉備援','邀工業用戶一起投資新電網'],best:3,why:'兩座既有電廠能在併網限制下互相補位。'},
 server:{ctx:'客戶只收已認證零件',a:['重排組裝班次','自行開發替換零件','和同業互換不同型號零件','預留客戶尚未認證的備品','和認證供應商共用庫存及交期資料'],best:4,why:'從合格供應網調度原規格零件，可照原流程驗收。'},

const P={x:0,y:0,z:6,vy:0,yaw:0,pitch:-0.02};const EYEH=1.65;
function inCircle(x,z,cz,r){return x*x+(z-cz)*(z-cz)<=r*r;}
function walkable(x,z){
  if(z>12||z<FZ-10||Math.abs(x)>HALF)return false;
  for(let i=0;i<N;i++){const wz=WZ(i);
    if(!solved[i]&&z<wz+0.9)return false;
    if(Math.abs(z-wz)<1.3&&Math.abs(x)>3.0)return false;
    const cz=CZ(i);if(Math.abs(x)<5.8&&z<cz-11&&z>cz-13.2)return false;}

}

let actx=null;
function beep(freqs,dur=0.12,type='triangle',vol=0.07){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();let t=actx.currentTime;
  freqs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur*1.6);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur*1.6);t+=dur*0.85;});}catch(e){}}

  if(!isTouch&&!locked){t.textContent='點一下畫面鎖定滑鼠（也可以按住滑鼠拖曳轉視角）';t.hidden=false;}else t.hidden=true;}
let bannerTimer=null;
function showBanner(top,big){$('bnTop').textContent=top;$('bnBig').textContent=big;const b=$('banner');b.classList.add('show');clearTimeout(bannerTimer);bannerTimer=setTimeout(()=>b.classList.remove('show'),2600);}
function bump(id){const el=$(id);el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}
function hud(){
  $('mCap').querySelector('b').textContent=res.cap;$('mSc').querySelector('b').textContent=res.sc+' / 10';if(started)pub({sc:res.sc,cap:res.cap,st:stageIdx,pk:myPk});
  $('progress').innerHTML=ROUNDS.map((r,i)=>{const col=rCol(r);const cls=solved[i]?'done':(i===stageIdx?'cur':'');
    return `<span class="pill ${cls}" style="${solved[i]?'background:'+col:''}">${i+1}</span>`;}).join('');
}
const fmt=v=>(v>0?'+':'')+String(v).replace('-','−');
function addRes(d){if(d.cap){res.cap+=d.cap;bump('mCap');}if(d.sc){res.sc+=d.sc;bump('mSc');}hud();}
function chips(d){const a=[];if(d.sc)a.push(`<span class="d up">策略分 +${d.sc}</span>`);if(d.cap)a.push(`<span class="d ${d.cap>0?'up':'down'}">資本 ${fmt(d.cap)}</span>`);return a.length?`<div class="deltas">${a.join('')}</div>`:'<p class="muted">這回合沒有得分。</p>';}
const nextBtn=i=>`<div class="row"><button class="btn stage" data-act="advance" data-focus>${i<N-1?'開門前往第 '+(i+2)+' 回合':'開門前往終點'}</button></div>`;

handlers.pick=b=>{chosen=+b.dataset.i;panel.querySelectorAll('.co').forEach(x=>x.classList.toggle('sel',x===b));const s=$('startBtn');s.disabled=false;s.style.opacity=1;s.textContent='以「'+COMP[chosen].name+'」出發';};

/* 事件卡 */
function showEventCard(i){
  const rd=ROUNDS[i];if(!rd)return;const col=rCol(rd);const my=COMP[me];
  const ctx=rd.type==='risk'&&rd.ctxLabel?`<div class="box"><p><b>${rd.ctxLabel}：</b>${rd.data[my.id].ctx}</p></div>`:'';
  const task=rd.type==='coop'?`這回合只有<b>互賴說</b>。去找互賴說的守護者，從另外五家公司挑一家配對，各自投入 1～6 資本。主持人公布等級後，S、A 級各得 1 策略分；雙方拿回本金，再各拿配對綜效。如果你選的是真人組別，對方會收到邀請，你們可以先在對話框聊聊，再由對方選擇同意或拒絕。`
    :rd.type==='invest'?`四位方案顧問各拿著一張方案卡，成本 5 或 9 資本。走到想買的方案面前付費，也可以保留資本不投資。亮牌後公布答案，每張方案值 0、1 或 2 分。你目前有 <b>${res.cap}</b> 資本。`
    :`五位說的守護者舉著<b>${my.name}</b>在這回合可以採取的行動。暗選一個說：走到它面前互動並選定，<b>每回合只能選一個說</b>。答中主持人答案得 1 策略分。`;
  const go=rd.type==='coop'?'去找互賴說':rd.type==='invest'?'去看方案':'去找說的守護者';
  openPanel(`
   <div class="eyebrow"><span class="tag th">第 ${i+1} 回合 · ${TYPENAME[rd.type]}</span><span class="tag">${rd.eraName}</span><span class="tag">${my.name}</span></div>
   <h2>${rd.title}</h2>
   <p>${rd.event}</p>
   ${ctx}
   <div class="box task"><p>${task}</p></div>
   <div class="row"><button class="btn stage" data-act="close" data-focus>${go}</button><button class="btn ghost" data-act="replay" data-i="${i}">重播快訊影片</button></div>`,col);
}
handlers.close=()=>closePanel();
handlers.replay=b=>{const i=+b.dataset.i;overlayEl.hidden=true;playFilm(i,()=>showEventCard(i));};
handlers.advance=()=>{overlayEl.hidden=true;startAuto(stageIdx-1);};
function startIntro(i){introShown[i]=true;showBanner('第 '+(i+1)+' 回合',ROUNDS[i].title);playFilm(i,()=>showEventCard(i));}

/* NPC 互動 */
let target=null;const ray=new THREE.Raycaster();const center=new THREE.Vector2(0,0);
function interact(){if(!started||paused||!target)return;openNpcCard(target);}
function openNpcCard(n){
  const rd=ROUNDS[n.stage],col=n.color;const active=n.stage===stageIdx&&!solved[n.stage];
  n.wave=1.5;beep([587],0.07,'sine',0.05);
  const tagline=`<span class="tag">第 ${n.stage+1} 回合 · ${rd.title}</span>`;
  if(n.kind==='shuo'){const d=rd.data[COMP[me].id];
    openPanel(`<div class="eyebrow"><span class="tag th">${n.head}</span>${tagline}</div><h2 style="color:${col}">${n.name}</h2><p class="muted">${TH[n.head].desc}</p>
     <div class="box"><p class="muted" style="font-size:13px">${COMP[me].name}用${n.head}會這樣做</p><p class="big-act">${d.a[n.k]}</p></div>
     ${n.chosen?'<p><b>這是你這回合選定的說。</b></p>':''}
     ${active?`<p>確定這回合要用<b>${n.head}</b>嗎？選定後這回合就不能再換。</p><div class="row"><button class="btn stage" data-act="choose" data-k="${n.k}" data-focus>選定${n.head}</button><button class="btn ghost" data-act="close">再看看</button></div>`
       :`<p class="muted">這回合主持人的答案是「${SHUO[d.best]}」。</p><div class="row"><button class="btn ghost" data-act="close" data-focus>關閉</button></div>`}`,col);return;}
  if(n.kind==='coop'){
    openPanel(`<div class="eyebrow"><span class="tag th">互賴說</span>${tagline}</div><h2 style="color:${col}">${n.name}</h2><p class="muted">${TH['互賴說'].desc}</p>
     <div class="box"><p>從另外五家公司挑一家配對，雙方各自投入 1～6 資本（以手上資本為限）。主持人公布等級後，S、A 級各得 1 策略分；雙方拿回本金，再各拿配對綜效。<b>選定夥伴之後就不能更換。</b></p></div>
     ${n.chosen?'<p><b>這回合你已經完成配對。</b></p>':''}
     <div class="row">${active?`<button class="btn stage" data-act="coopStart" data-focus>開始挑夥伴</button>`:''}<button class="btn ghost" data-act="close">${active?'再看看':'關閉'}</button></div>`,col);return;}
  const p=rd.plans[n.k];const can=res.cap>=p.cost;
  openPanel(`<div class="eyebrow"><span class="tag th">方案 ${n.label}</span>${tagline}</div>
   <h2>${p.short}</h2><div class="box"><p class="big-act" style="font-size:18px">${p.text}</p></div>
   <p>成本 <b>${p.cost} 資本</b>，你目前有 ${res.cap} 資本。${n.chosen?'<b>這是你這回合買下的方案。</b>':''}</p>
   ${active?`<div class="row">${can?`<button class="btn stage" data-act="plan" data-k="${n.k}" data-focus>付 ${p.cost} 資本買這個方案</button>`:'<button class="btn ghost" disabled>資本不足</button>'}<button class="btn ghost" data-act="skipInvest">這回合不投資</button><button class="btn ghost" data-act="close">再看看</button></div>`
     :(n.stage<stageIdx?`<p class="muted">主持人答案：${p.pts} 分。${p.why}</p>`:'')+`<div class="row"><button class="btn ghost" data-act="close" data-focus>關閉</button></div>`}`,col);
}
function solveStage(i){solved[i]=true;stageIdx=i+1;hud();}
const others=()=>COMP.filter((c,j)=>j!==me);

/* 事件＋五說 */
function simRisk(i){const rd=ROUNDS[i];return npcCos().map(c=>{const d=rd.data[c.id];const ok=Math.random()<0.45;
  const k=ok?d.best:[0,1,2,3,4].filter(x=>x!==d.best)[Math.floor(Math.random()*4)];if(ok)sim[c.id].sc+=1;return {c,k,ok};});}
handlers.choose=b=>{
  const i=stageIdx,rd=ROUNDS[i],k=+b.dataset.k,my=COMP[me],d=rd.data[my.id],ok=k===d.best;
  const delta={sc:ok?1:0};addRes(delta);picks[i]={k,ok};myPk[i]=k;solveStage(i);
  const rev=simRisk(i);
  const cn=npcs.find(n=>n.stage===i&&n.k===k);if(cn){markChosen(cn);ok?cn.cheer=3:cn.sad=2;}
  if(!ok){const bn=npcs.find(n=>n.stage===i&&n.k===d.best);if(bn)bn.cheer=3;}
  ok?beep([659,784,1047,1319],0.11):beep([330,247],0.18);
  openPanel(`
   <div class="verdict"><span class="mark" style="background:${ok?'var(--good)':'var(--bad)'}">${ok?'✓':'✗'}</span><div><h2>${ok?'答中主持人答案！':'不是主持人的答案'}</h2><p class="muted">第 ${i+1} 回合 · 你選了 ${SHUO[k]}</p></div></div>
   ${chips(delta)}
   <div class="box"><p>主持人答案：${my.name}｜<b>${SHUO[d.best]}</b>。${d.why}</p></div>
   <h3>你的五個選項</h3>
   <div class="tbl-wrap"><table style="min-width:420px"><thead><tr><th>說</th><th>行動</th></tr></thead><tbody>
    ${d.a.map((a,j)=>`<tr class="${j===d.best?'ans':''} ${j===k?'mine':''}"><td>${SHUO[j]}${j===d.best?' ★':''}</td><td>${a}</td></tr>`).join('')}
   </tbody></table></div>
   <h3>其他公司同時亮牌</h3>
   <div class="revgrid">${rev.map(o=>`<div><span>${o.c.short}</span><span>${SHUO[o.k]} <i style="color:${o.ok?'var(--good)':'var(--bad)'}">${o.ok?'✓':'✗'}</i></span></div>`).join('')}${humanRev(i)}</div>
   ${nextBtn(i)}`,rCol(rd));
};

/* 永續投資 */
function simInvest(i){const rd=ROUNDS[i];return npcCos().map(c=>{const s=sim[c.id];let k=-1;
  if(Math.random()>0.2){const opts=rd.plans.map((q,j)=>j).filter(j=>rd.plans[j].cost<=s.cap);if(opts.length){const top=opts.filter(j=>rd.plans[j].pts===2);k=(top.length&&Math.random()<0.4)?top[0]:opts[Math.floor(Math.random()*opts.length)];}}
  if(k>=0){s.cap-=rd.plans[k].cost;s.sc+=rd.plans[k].pts;}return {c,k,pts:k>=0?rd.plans[k].pts:0};});}
handlers.plan=b=>finishInvest(+b.dataset.k);
handlers.skipInvest=()=>finishInvest(-1);
function finishInvest(k){
  const i=stageIdx,rd=ROUNDS[i];const p=k>=0?rd.plans[k]:null;
  const delta=p?{cap:-p.cost,sc:p.pts}:{};addRes(delta);picks[i]={k,pts:p?p.pts:0};myPk[i]=k;solveStage(i);
  const rev=simInvest(i);
  if(p){const cn=npcs.find(n=>n.stage===i&&n.k===k);if(cn){markChosen(cn);p.pts>0?cn.cheer=3:cn.sad=2;}}
  const bestJ=rd.plans.reduce((b2,q,j)=>q.pts>rd.plans[b2].pts?j:b2,0);const bn=npcs.find(n=>n.stage===i&&n.k===bestJ);if(bn&&bestJ!==k)bn.cheer=3;
  const good=p&&p.pts>0;good?beep([659,784,1047,1319],0.11):beep([330,247],0.18);
  openPanel(`
   <div class="verdict"><span class="mark" style="background:${good?'var(--good)':'var(--bad)'}">${p?(p.pts===2?'✓':p.pts===1?'△':'✗'):'—'}</span><div><h2>${p?'方案 '+'ABCD'[k]+'：'+p.pts+' 分':'這回合不投資'}</h2><p class="muted">第 ${i+1} 回合 · ${rd.title}</p></div></div>
   ${chips(delta)}
   <h3>亮牌：四張方案的主持人答案</h3>
   <div class="tbl-wrap"><table><thead><tr><th>方案</th><th class="n">成本</th><th>內容</th><th class="n">分數</th><th>理由</th></tr></thead><tbody>
    ${rd.plans.map((q,j)=>`<tr class="${j===bestJ?'ans':''} ${j===k?'mine':''}"><td>${'ABCD'[j]}</td><td class="n">${q.cost}</td><td>${q.short}</td><td class="n">${q.pts}</td><td>${q.why}</td></tr>`).join('')}
   </tbody></table></div>
   <h3>其他公司同時亮牌</h3>
   <div class="revgrid">${rev.map(o=>`<div><span>${o.c.short}</span><span>${o.k>=0?'方案 '+'ABCD'[o.k]:'不投資'} <i>${o.pts} 分</i></span></div>`).join('')}${humanRev(i)}</div>
   ${nextBtn(i)}`,RCOL.invest);
}

/* 合作（互賴說） */
let coop={};
handlers.coopStart=()=>{
  const my=COMP[me];const H=humansByCo();
  openPanel(`
   <div class="eyebrow"><span class="tag th">互賴說</span><span class="tag">步驟 1 / 2</span></div>
   <h2>挑一家公司配對</h2>
   <p class="muted">${my.name}的核心能力：${my.core}；最需要：${my.need}。選定之後就不能更換。</p>
   <div class="cogrid">${COMP.map((c,i)=>i===me?'':`<button class="co" data-act="partner" data-ci="${i}"><span class="sw" style="background:${c.color}"></span><b>${c.name}</b><small>核心：${c.core}<br>需要：${c.need}<br>${H[c.id]?'<b>真人：'+esc(H[c.id].nick)+'・第 '+(H[c.id].st+1)+' 回合</b>':'電腦代打・資本 '+sim[c.id].cap}</small></button>`).join('')}</div>`,TH['互賴說'].color);
};
handlers.partner=b=>{
  const ci=+b.dataset.ci;coop={ci};const c=COMP[ci],col=TH['互賴說'].color;const max=Math.min(6,res.cap);
  const hh=humansByCo()[c.id];if(hh){startInvite(c,hh);return;}
  if(max<1){openPanel(`<h2>資本不足</h2><p>你目前沒有資本可以投入，這回合無法和${c.name}配對，維持原資本與分數。</p><div class="row"><button class="btn stage" data-act="coopNone" data-focus>結束這回合</button></div>`,col);return;}
  openPanel(`
   <div class="eyebrow"><span class="tag th">互賴說</span><span class="tag">步驟 2 / 2</span></div>
   <h2>和${c.name}配對，你要投入多少資本？</h2>
   <p>${c.name}同意配對，夥伴已鎖定。雙方各自投入 1～6 資本，鎖定後主持人才公布等級。你目前有 ${res.cap} 資本。</p>
   <div class="row">${Array.from({length:max},(_,k)=>k+1).map(v=>`<button class="btn ${v===Math.min(3,max)?'stage':'ghost'}" data-act="invest" data-v="${v}" ${v===Math.min(3,max)?'data-focus':''}>投入 ${v}</button>`).join('')}</div>`,col);
};
function simCoop(i,partnerId){const rd=ROUNDS[i];const rest=npcCos().map(c=>c.id).filter(id=>id!==partnerId).sort(()=>Math.random()-0.5);const out=[];
  for(let j=0;j+1<rest.length;j+=2){const a=rest[j],b=rest[j+1];const g=rd.grades[pairKey(a,b)];
    const ia=Math.min(sim[a].cap,Math.ceil(rnd(0.01,6))),ib=Math.min(sim[b].cap,Math.ceil(rnd(0.01,6)));const tot=ia+ib;const ex=tot>=2?EXTRA[g][Math.min(12,tot)-2]:0;const pt=(g==='S'||g==='A')?1:0;
    [a,b].forEach(id=>{sim[id].cap+=ex;sim[id].sc+=pt;});out.push({a,b,g});}
  if(rest.length%2)out.push({a:rest[rest.length-1],b:null,g:'—'});
  return out;}
handlers.coopNone=()=>{const i=stageIdx;picks[i]={partner:null};const rev=simCoop(i,null);solveStage(i);
  openPanel(`<h2>這回合沒有配對</h2><p class="muted">維持原資本與分數。</p>${coopRev(rev)}${nextBtn(i)}`,TH['互賴說'].color);};
function coopRev(rev){return `<h3>其他公司的配對</h3><div class="revgrid">${rev.map(o=>`<div><span>${COMP[CI[o.a]].short}${o.b?' × '+COMP[CI[o.b]].short:'（未配對）'}</span><i>${o.g}</i></div>`).join('')}${humanRev(stageIdx-1)}</div>`;}
handlers.invest=b=>{
  const i=stageIdx,rd=ROUNDS[i];const inv=+b.dataset.v;const c=COMP[coop.ci];const ps=sim[c.id];
  const pinv=Math.min(ps.cap,Math.ceil(rnd(0.01,6)));const total=inv+pinv;
  const key=pairKey(COMP[me].id,c.id);const g=rd.grades[key];const extra=total>=2?EXTRA[g][Math.min(12,total)-2]:0;const pt=(g==='S'||g==='A')?1:0;
  addRes({cap:extra,sc:pt});ps.cap+=extra;ps.sc+=pt;
  picks[i]={partner:c.id,g,inv,pinv,extra,pt};myPk[i]=c.id;
  const rev=simCoop(i,c.id);solveStage(i);
  const hn=npcs.find(n=>n.stage===i&&n.kind==='coop');if(hn){markChosen(hn);pt?hn.cheer=3:hn.sad=2;}
  pt?beep([659,784,1047,1319],0.11):beep([392,330],0.15);
  const best=COMP.filter(x=>x.id!==COMP[me].id&&rd.grades[pairKey(COMP[me].id,x.id)]==='S').map(x=>x.name).join('、');
  openPanel(`

let last=performance.now(),T=0;
function tryMove(dx,dz){if(walkable(P.x+dx,P.z+dz)){P.x+=dx;P.z+=dz;}else if(walkable(P.x+dx,P.z)){P.x+=dx;}else if(walkable(P.x,P.z+dz)){P.z+=dz;}}
function loop(now){

  if(auto)stepAuto(dt);

    let f=(K.KeyW||K.ArrowUp?1:0)-(K.KeyS||K.ArrowDown?1:0)+joy.y;
    let s=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0)+joy.x;
    const m=Math.hypot(f,s);if(m>1){f/=m;s/=m;}
    const sp=(K.ShiftLeft||K.ShiftRight)?10:6.5;

    tryMove((-f*sy+s*cy)*sp*dt,(-f*cy-s*sy)*sp*dt);

    P.vy-=18*dt;P.y=Math.max(0,P.y+P.vy*dt);if(P.y===0)P.vy=0;
    for(const n of npcs){const dx=P.x-n.x,dz=P.z-n.z,d=Math.hypot(dx,dz);if(d<0.9&&d>0.001){const nx=n.x+dx/d*0.9,nz=n.z+dz/d*0.9;if(walkable(nx,nz)){P.x=nx;P.z=nz;}}}
    const a=arenaAt(P.x,P.z);

    if(solved[N-1]&&!ended&&inCircle(P.x,P.z,FZ-2,3.4))showEnding();
  }else if(!started){P.yaw+=dt*0.1;P.pitch=-0.04;}
  camera.position.set(P.x,P.y+EYEH,P.z);camera.rotation.x=P.pitch;camera.rotation.y=P.yaw;
  if(sky)sky.position.copy(camera.position);
  target=null;
  if(started&&!paused){
    ray.setFromCamera(center,camera);ray.far=7.5;
    const hit=ray.intersectObjects(hitList,false).find(h=>h.object.userData.npc.root.visible);
    if(hit)target=hit.object.userData.npc;
    const pr=$('prompt');$('crosshair').classList.toggle('on',!!target);
    if(target){const act=target.stage===stageIdx&&!solved[target.stage];
      pr.innerHTML=`<kbd>${isTouch?'互動':'E'}</kbd>${act?'和 ':'看看 '}${target.name}${act?' 對話':''}`;pr.hidden=false;}
    else pr.hidden=true;
  }
  for(const n of npcs){
    const vis=Math.abs(P.z-n.z)<95;n.root.visible=vis;n.sg.visible=vis;if(!vis)continue;
    const t=T+n.phase;const near=Math.hypot(P.x-n.x,P.z-n.z)<6;
    const want=near?Math.atan2(P.x-n.x,P.z-n.z):n.face;
    let diff=want-n.root.rotation.y;diff=Math.atan2(Math.sin(diff),Math.cos(diff));n.root.rotation.y+=diff*Math.min(1,dt*4);
    n.armL.rotation.set(Math.sin(t*1.5)*0.07,0,-0.08);n.armR.rotation.set(-Math.sin(t*1.5)*0.07,0,0.08);
    n.body.position.y=Math.sin(t*1.5)*0.02;n.body.rotation.x=0;
    if(n===target&&n.wave<=0)n.wave=0.6;
    if(n.wave>0){n.wave-=dt;n.armR.rotation.z=2.5+Math.sin(T*11)*0.35;}
    if(n.cheer>0){n.cheer-=dt;n.body.position.y=Math.abs(Math.sin(T*8))*0.8;n.armL.rotation.z=-2.6;n.armR.rotation.z=2.6;}
    if(n.sad>0){n.sad-=dt;n.body.rotation.x=0.2;n.armL.rotation.x=0.25;n.armR.rotation.x=0.25;}
  }
  for(const l of leaves){if(!l.got){l.m.rotation.y+=dt*2.2;l.m.position.y=1.05+Math.sin(T*2.5+l.z)*0.15;}}
  for(const b of barriers){if(b.opening&&b.open<1){b.open=Math.min(1,b.open+dt*0.75);const e=1-Math.pow(1-b.open,3);b.L.rotation.y=e*1.75;b.R.rotation.y=-e*1.75;}}
  sunL.position.set(P.x-60,55,P.z+20);sunL.target.position.set(P.x,0,P.z-20);
  for(const v of traffic){v.m.position.z+=v.dir*v.sp*dt;if(v.m.position.z<FZ-195)v.m.position.z=40;else if(v.m.position.z>40)v.m.position.z=FZ-195;}
  for(const r of remote.values()){if(!r.av||r.tx==null)continue;const a=r.av;const kk=Math.min(1,dt*8);const px=a.root.position.x,pz=a.root.position.z;
    a.root.position.x+=(r.tx-px)*kk;a.root.position.z+=(r.tz-pz)*kk;let dd=(r.tyaw+Math.PI)-a.root.rotation.y;dd=Math.atan2(Math.sin(dd),Math.cos(dd));a.root.rotation.y+=dd*kk;
    const sw=Math.hypot(r.tx-px,r.tz-pz)>0.03?Math.sin(T*9)*0.6:0;a.armL.rotation.x=sw;a.armR.rotation.x=-sw;}
  if(started&&net){pubT+=dt;if(pubT>0.12){pubT=0;const nx=+P.x.toFixed(2),nz=+P.z.toFixed(2),ny=+P.yaw.toFixed(2);if(nx!==lastPos[0]||nz!==lastPos[1]||ny!==lastPos[2]){lastPos=[nx,nz,ny];pub({x:nx,z:nz,yaw:ny});}}}
  if(mrt){mrt.position.z-=dt*14;if(mrt.position.z<FZ-190)mrt.position.z=38;}
  if(trophy){trophy.position.y=3+Math.sin(T*2)*0.15;trophy.rotation.y+=dt;}
  if(film){if(film.video){const v=$('filmV');if(v.duration)$('filmProg').style.width=(v.currentTime/v.duration*100)+'%';}else drawFilm(now);}
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

const fontReady=document.fonts?Promise.race([Promise.all([document.fonts.load('900 40px "Noto Sans TC"'),document.fonts.load('700 40px "Noto Sans TC"'),document.fonts.load('900 40px "Noto Serif TC"')]),new Promise(r=>setTimeout(r,2800))]):Promise.resolve();
fontReady.catch(()=>{}).then(()=>{buildWorld();enableShadows();hud();showStart();requestAnimationFrame(loop);initRoom();});
})();
</script>
