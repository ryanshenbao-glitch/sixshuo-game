<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>永續價值進化：新創競技場</title>
<meta name="description" content="策略思維與永續發展第五組桌遊：六家 AI 新創在園區小島上闖過八回合，用九說做策略判斷、合作與永續投資。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* 版面：全螢幕斜俯瞰小島（動森視角），角落是圓胖的 HUD 泡泡，對話框貼底、選項浮在右上，資訊卡與園區手機置中。刻意只做一種明亮白天的世界觀。 */
:root{
  --paper:#fffcf1; --cream:#f8f1dc; --ink:#6e583d; --ink2:#a08a6b; --line:#eadfc2;
  --teal:#20b2a4; --teal-d:#178a7f; --sun:#f8d454; --leafc:#79c652; --coral:#ee8a6c; --sky:#a9e2f5;
  --f:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --fn:"Fredoka","Huninn","Noto Sans TC",sans-serif;
  --pop:0 4px 0 rgba(110,88,61,.16),0 10px 24px rgba(60,48,30,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--f);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font-family:var(--f);color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.num{font-family:var(--fn);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.ui{position:fixed;inset:0;pointer-events:none;z-index:5}
.ui > *{pointer-events:auto}
@media (min-width:1900px){.ui,.ovl{zoom:1.1}}
@media (min-width:2300px){.ui,.ovl{zoom:1.25}}
@media (min-width:3000px){.ui,.ovl{zoom:1.6}}

/* HUD 泡泡 */
.bub{background:var(--paper);border-radius:999px;box-shadow:var(--pop);display:flex;align-items:center;gap:8px;padding:6px 14px 6px 7px;font-weight:700;white-space:nowrap}
#hudL{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none}
#hudL .bub b{font-family:var(--fn);font-size:21px;line-height:1}
#hudL .bub small{font-size:12px;color:var(--ink2)}
.ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;font-family:var(--fn);font-weight:700;font-size:15px}
.ic.coin{background:radial-gradient(circle at 35% 30%,#fff0a8,#f0bd2e 60%,#d99a12);box-shadow:inset 0 0 0 2px #d6971a;color:#9a6a08}
.ic.star{background:var(--leafc);box-shadow:inset 0 0 0 2px #5ea43b}
.ic.co{box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
#meBub span{font-size:15px}
#hudR{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#netBub{font-size:13px;padding:6px 12px;pointer-events:none}
#netBub i{width:9px;height:9px;border-radius:50%;background:#c7b998;display:inline-block}
#netBub.on i{background:var(--leafc);box-shadow:0 0 0 3px rgba(121,198,82,.25)}
#phoneBtn{border:0;cursor:pointer;width:64px;height:64px;border-radius:22px;background:var(--teal);box-shadow:var(--pop);display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;gap:0;padding:6px 0 4px}
#phoneBtn svg{width:28px;height:28px}
#evBtn{border:0;cursor:pointer;width:64px;height:64px;border-radius:22px;background:#f0bd2e;box-shadow:var(--pop);display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;padding:6px 0 4px;margin-top:10px}#evBtn svg{width:28px;height:28px}#evBtn:hover{transform:translateY(-1px)}
#phoneBtn:hover{transform:translateY(-1px)}
#dots{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:8px 14px;gap:7px;pointer-events:none}
#dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block;transition:transform .3s}
#dots i.done{background:var(--c)}
#dots i.cur{background:var(--c);transform:scale(1.45);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c)}
#dots span{font-size:13px;margin-left:4px}
#waitBub{position:absolute;top:calc(62px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-size:14px;padding:7px 8px 7px 16px}
#waitBub button{border:0;border-radius:999px;background:var(--cream);padding:5px 12px;font-weight:700;cursor:pointer}
#toast{position:absolute;top:calc(110px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);white-space:normal;text-align:center;padding:9px 18px;font-size:15px;pointer-events:none;animation:drop .35s ease-out}
@keyframes drop{from{transform:translate(-50%,-10px);opacity:0}}
#prompt{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:16px;padding:7px 18px 7px 7px;cursor:pointer}
.abtn{width:32px;height:32px;border-radius:50%;background:var(--leafc);color:#fff;font-family:var(--fn);font-weight:700;display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
#banner{position:absolute;left:50%;top:26%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .6s}
#banner.show{opacity:1}
#banner small{display:inline-block;background:var(--bc,var(--teal));color:#fff;border-radius:999px;padding:5px 18px;font-size:16px;letter-spacing:.2em}
#banner b{display:block;font-size:clamp(34px,6vw,58px);color:#fff;letter-spacing:.06em;margin-top:8px;text-shadow:0 3px 0 rgba(110,88,61,.35),0 0 24px rgba(110,88,61,.3)}
#keys{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:12px;padding:6px 12px;color:var(--ink2);pointer-events:none}
#keys kbd{font-family:var(--fn);background:var(--cream);border-radius:6px;padding:0 6px;color:var(--ink)}

/* 對話框（動森） */
#dlg{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(780px,calc(100% - 28px));background:var(--paper);border-radius:52px/40px;padding:32px 44px 30px;box-shadow:var(--pop);cursor:pointer;animation:pop .22s ease-out}
@keyframes pop{from{transform:translate(-50%,10px) scale(.97);opacity:0}}
#dlgName{position:absolute;left:30px;top:-19px;transform:rotate(-4deg);background:var(--nc,var(--sun));color:#fff;font-weight:700;padding:6px 20px;border-radius:999px;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.1);max-width:calc(100% - 60px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dside{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-58%);width:min(360px,calc(100% - 32px));max-height:52vh;overflow:auto;background:var(--paper);border-radius:26px;padding:18px 22px 20px;box-shadow:var(--pop);border-top:8px solid var(--sc,#20b2a4);animation:pop .22s ease-out;z-index:5}
#dside small{display:block;color:var(--ink2);font-weight:700;font-size:13px;letter-spacing:.06em}#dside h3{margin:4px 0 8px;font-size:21px;color:var(--ink);text-wrap:balance}#dside p{margin:0 0 10px;font-size:15.5px;line-height:1.7;color:var(--ink)}#dside .note{font-size:14.5px;line-height:1.65}
@media (max-width:760px){#dside{top:calc(12px + env(safe-area-inset-top,0px));transform:none;max-height:30vh;padding:12px 16px}#dside h3{font-size:17px}#dside p{font-size:14px}}
#dlgText{font-size:19px;line-height:1.75;min-height:3.5em;max-height:42vh;overflow:auto;white-space:pre-line;max-width:44em}
#dlgCaret{position:absolute;right:38px;bottom:14px;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:13px solid var(--sun);animation:bob .7s ease-in-out infinite}
#dlgSkip{position:absolute;right:28px;top:-16px;border:0;border-radius:999px;background:var(--cream);font-size:13px;font-weight:700;padding:5px 12px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.08)}
@keyframes bob{50%{transform:translateY(4px)}}
#choices{position:absolute;right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;align-items:stretch;max-width:min(420px,calc(100% - 36px));animation:fade .2s}
#choices.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-width:min(470px,calc(100% - 36px))}
@keyframes fade{from{opacity:0}}
.ch{border:0;text-align:left;background:var(--paper);border-radius:22px;padding:11px 20px 11px 34px;font-size:17px;font-weight:700;box-shadow:var(--pop);cursor:pointer;position:relative;line-height:1.4}
.ch::before{content:"";position:absolute;left:13px;top:50%;margin-top:-6px;border-left:9px solid var(--ink2);border-top:6px solid transparent;border-bottom:6px solid transparent;opacity:.25}
.ch:hover,.ch:focus-visible{background:#fff6c6;outline:none}
.ch:hover::before,.ch:focus-visible::before{opacity:1;border-left-color:var(--coral)}
.ch:disabled{opacity:.45;cursor:not-allowed}
#choices.grid .ch{padding:11px 10px 11px 26px;font-size:16px}
#choices.grid .ch::before{left:9px}

/* 卡片與手機 */
.ovl{position:fixed;inset:0;z-index:20;background:rgba(92,74,48,.32);display:flex;align-items:center;justify-content:center;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.card{position:relative;background:var(--paper);border-radius:30px;width:100%;max-width:700px;max-height:100%;overflow:auto;box-shadow:var(--pop);border:5px solid #fff;-webkit-user-select:text;user-select:text;animation:pop2 .25s ease-out}
@keyframes pop2{from{transform:translateY(10px) scale(.98);opacity:0}}
.card-h{background:var(--cc,var(--teal));color:#fff;padding:16px 26px 14px;border-radius:24px 24px 0 0;display:flex;flex-direction:column;gap:4px;background-image:radial-gradient(rgba(255,255,255,.16) 2px,transparent 2.5px);background-size:16px 16px}
.card-h small{font-size:13px;letter-spacing:.12em;opacity:.95}
.card-h h2{margin:0;font-size:26px;font-weight:400;line-height:1.3;text-wrap:balance}
.card-b{padding:20px 26px 24px;display:flex;flex-direction:column;gap:14px}
.card p{margin:0;font-size:16px;line-height:1.85;max-width:40em}
.note{background:var(--cream);border-radius:18px;padding:13px 16px;font-size:15px}
.note b{color:var(--teal-d)}
.task{background:#e8f7f3;border:2px dashed #9fd8cf}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:11px 22px;font-size:16px;font-weight:700;cursor:pointer;background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal-d)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-d)}
.btn.ghost{background:var(--cream);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
h3{margin:4px 0 0;font-size:17px;font-weight:400;color:var(--teal-d)}
.res{display:flex;gap:12px;align-items:center}
.res .big{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--fn);font-size:30px;font-weight:700;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.res h2{margin:0;font-size:22px;font-weight:400}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--fn);font-weight:600;font-size:14px;border-radius:999px;padding:3px 12px;background:var(--cream)}
.chip.up{background:#e3f4d6;color:#3f8a1f}.chip.dn{background:#fde5da;color:#b9512f}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px 12px;font-size:14.5px;border:2px solid transparent}
.row.me{border-color:var(--sun)}
.row .dot{width:14px;height:14px;border-radius:50%}
.row small{color:var(--ink2);display:block;font-size:13px;line-height:1.45}
.row .pts{font-family:var(--fn);font-weight:700;font-size:16px;white-space:nowrap}
.cogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cob{border:3px solid transparent;background:#fff;border-radius:20px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;box-shadow:0 3px 0 var(--line)}
.cob b{font-size:16px;font-weight:400}
.cob small{font-size:12.5px;color:var(--ink2);line-height:1.5}
.cob .sw{height:8px;border-radius:4px}
.cob.sel{border-color:var(--teal);background:#effaf8}
.cob:disabled{opacity:.5;cursor:not-allowed}
.txt{flex:1 1 150px;min-width:0;font:inherit;font-size:16px;padding:11px 16px;border:2px solid var(--line);border-radius:999px;background:#fff;color:var(--ink)}
.txt:focus{outline:none;border-color:var(--teal)}
.code{font-family:var(--fn);letter-spacing:.25em;text-transform:uppercase}
.inrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stars{font-size:26px;letter-spacing:.1em;color:var(--sun);text-shadow:0 2px 0 rgba(110,88,61,.2)}
.stars s{text-decoration:none;color:var(--line)}
.tblw{overflow-x:auto;border-radius:14px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:14px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--cream);vertical-align:top}
th{color:var(--ink2);font-weight:400;font-size:13px}
.title-logo{font-size:clamp(30px,6vw,44px);line-height:1.2;margin:0;font-weight:400;text-wrap:balance}

#phone .ph{position:relative;width:min(380px,100%);height:min(680px,100%);background:var(--cream);border-radius:46px;border:9px solid #fff;box-shadow:var(--pop);display:flex;flex-direction:column;overflow:hidden;animation:pop2 .25s ease-out}
.ph-top{background:var(--teal);color:#fff;padding:16px 22px 12px;display:flex;justify-content:space-between;align-items:center}
.ph-top b{font-size:18px;font-weight:400}
.ph-top button{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:5px 12px;font-weight:700;cursor:pointer}
.ph-body{flex:1;overflow:auto;padding:18px;-webkit-user-select:text;user-select:text}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px}
.app{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:700}
.app i{width:62px;height:62px;border-radius:22px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.app svg{width:30px;height:30px}
.ph-body p{font-size:15px;line-height:1.8;margin:0 0 10px}
.ph-body .note{margin-bottom:10px}

/* 手機觸控 */
#joy{position:absolute;left:max(22px,calc(env(safe-area-inset-left,0px) + 14px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(255,252,241,.55);box-shadow:inset 0 0 0 3px rgba(255,255,255,.8);touch-action:none}
#knob{position:absolute;left:38px;top:38px;width:48px;height:48px;border-radius:50%;background:var(--paper);box-shadow:var(--pop)}
#aBtn{position:absolute;right:max(22px,calc(env(safe-area-inset-right,0px) + 14px));bottom:calc(36px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;border:0;background:var(--leafc);color:#fff;font-family:var(--fn);font-size:30px;font-weight:700;box-shadow:0 5px 0 #5ea43b;touch-action:none}

@media (max-width:640px){
  #dlg{padding:28px 24px 24px;border-radius:36px/30px}
  #dlgText{font-size:17px}
  #choices.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cogrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card-b{padding:16px 18px 20px}
  .card-h{padding:14px 18px 12px}
  #dots span{display:none}
  #dots{left:max(12px,env(safe-area-inset-left,0px));transform:none;top:calc(150px + env(safe-area-inset-top,0px));padding:7px 10px;gap:5px}
  #dots i{width:9px;height:9px}
  #meName{max-width:118px;overflow:hidden;text-overflow:ellipsis}
  #netBub{max-width:150px}
  #netTxt{overflow:hidden;text-overflow:ellipsis}
  #hudL .bub{padding:4px 12px 4px 5px}
  #hudL .ic{width:26px;height:26px;font-size:13px}
  #hudL{gap:6px}
  #hudL .bub b{font-size:18px}
  #phoneBtn,#evBtn{width:56px;height:56px;border-radius:19px}
  #toast{top:calc(196px + env(safe-area-inset-top,0px))}
  #waitBub{top:calc(248px + env(safe-area-inset-top,0px));font-size:13px}
  #prompt{bottom:calc(170px + env(safe-area-inset-bottom,0px));font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.talk #joy,body.talk #aBtn{display:none!important}
#film{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#05070b;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.film-box{width:min(100%,1100px);display:flex;flex-direction:column;gap:12px}
#filmC{width:100%;max-width:100%;aspect-ratio:16/9;max-height:calc(100dvh - 120px);object-fit:contain;border-radius:14px;background:#000;display:block;border:0;box-shadow:0 18px 60px rgba(0,0,0,.5)}
.film-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#e8ecf2}
#filmLabel{flex:1 1 200px;min-width:0;font-size:16px}
.film-prog{flex:1 1 160px;height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
.film-prog i{display:block;height:100%;width:0;background:var(--teal)}
.film-bar .btn{font-size:14px;padding:8px 16px}
.film-bar label.btn{cursor:pointer}
#timerBub{font-size:14px;padding:6px 14px 6px 7px}
#timerBub b{font-size:22px;font-family:var(--fn)}
#timerBub small{color:var(--ink2);font-size:12px}
.ic.clock{background:var(--teal);font-size:15px}
#timerBub.low{background:#fde5da;animation:pulse 1s ease-in-out infinite}
#timerBub.low b{color:#b9512f}
@keyframes pulse{50%{transform:scale(1.06)}}
#lookHint{position:absolute;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:14px;padding:7px 16px;pointer-events:none}
.tb{position:absolute;width:56px;height:56px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-weight:700;font-size:15px;box-shadow:var(--pop);touch-action:none}
#jBtn{right:max(108px,calc(env(safe-area-inset-right,0px) + 100px));bottom:calc(30px + env(safe-area-inset-bottom,0px))}
#vBtn{right:max(30px,calc(env(safe-area-inset-right,0px) + 22px));bottom:calc(126px + env(safe-area-inset-bottom,0px))}
body.talk #jBtn,body.talk #vBtn{display:none!important}
#fade{position:fixed;inset:0;z-index:28;background:#fffcf1;pointer-events:none;animation:fadeio .7s ease-in-out forwards}
@keyframes fadeio{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
#err{position:fixed;inset:0;display:grid;place-items:center;font-size:18px;padding:16px;text-align:center}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="AI 園區小島"></canvas>

<div class="ui" id="ui">
  <div id="hudL" hidden>
    <div class="bub" id="meBub"><span class="ic co" id="meIc"></span><span id="meName"></span></div>
    <div class="bub"><span class="ic coin">$</span><b id="capV">6</b><small>資本</small></div>
    <div class="bub"><span class="ic star">★</span><b id="scV">0</b><small>/ 10 策略分</small></div>
  </div>
  <div class="bub" id="dots" hidden></div>

function rawH(x,z){const d=Math.hypot(x,z);let h=0;

  h+=24*Math.exp(-(((x+128)**2)+((z-82)**2))/1500)+14*Math.exp(-(((x+70)**2)+((z-128)**2))/900);

  h-=Math.max(0,-z-118)*0.55;h-=Math.max(0,d-WORLD)*0.8;return h;}
ZONES.forEach(z=>{z.h=z.id==='hub'?0:Math.max(0.6,rawH(z.x,z.z));});

function mergeGroup(g){g.updateMatrixWorld(true);const buckets=new Map();
  g.traverse(o=>{if(o.isMesh&&!o.isInstancedMesh){let b=buckets.get(o.material);if(!b)buckets.set(o.material,b=[]);b.push(o);}});
  const out=new THREE.Group();
  for(const [mat,list] of buckets){let n=0;const geos=list.map(o=>{const gg=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();gg.applyMatrix4(o.matrixWorld);n+=gg.attributes.position.count;return gg;});
    const pos=new Float32Array(n*3),nor=new Float32Array(n*3);let off=0;for(const gg of geos){pos.set(gg.attributes.position.array,off*3);nor.set(gg.attributes.normal.array,off*3);off+=gg.attributes.position.count;gg.dispose();}
    const bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.BufferAttribute(pos,3));bg.setAttribute('normal',new THREE.BufferAttribute(nor,3));bg.computeBoundingSphere();
    const mm=new THREE.Mesh(bg,mat);mm.castShadow=mm.receiveShadow=true;out.add(mm);}
  scene.add(out);return out;}

function buildTerrain(){
  const S2=(WORLD+60)*2,SEG=220;const geo=new THREE.PlaneGeometry(S2,S2,SEG,SEG);geo.rotateX(-Math.PI/2);
  const p=geo.attributes.position,col=new Float32Array(p.count*3),c=new THREE.Color(),g1=new THREE.Color('#8fcf68'),g2=new THREE.Color('#7cc25a'),sand=new THREE.Color('#f2e2b4'),rock=new THREE.Color('#b8a98d'),road=new THREE.Color('#e7d3a6');
  const roads=ZONES.filter(z=>z.id!=='hub').map(z=>{const d=Math.hypot(z.x,z.z);return {ux:z.x/d,uz:z.z/d,len:d};});
  for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),h=H(x,z);p.setY(i,h);
    const slope=Math.abs(H(x+1.5,z)-h)+Math.abs(H(x,z+1.5)-h);
    c.copy(g1).lerp(g2,(Math.sin(x*0.13)*Math.cos(z*0.11)+1)/2);
    if(slope>1.6||h>17)c.copy(rock);
    if(h<0.25&&Math.hypot(x,z)>40)c.copy(sand);
    for(const r of roads){const t=x*r.ux+z*r.uz,off=Math.abs(x*r.uz-z*r.ux);if(t>30&&t<r.len-12&&off<3.2){c.copy(road);break;}}
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;}
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));geo.computeVertexNormals();
  const t=new THREE.Mesh(geo,new THREE.MeshToonMaterial({vertexColors:true,gradientMap:GRAD}));t.receiveShadow=true;scene.add(t);
  const sea=new THREE.Mesh(new THREE.CircleGeometry(700,64),new THREE.MeshToonMaterial({color:'#5ccbe6',gradientMap:GRAD}));sea.rotation.x=-Math.PI/2;sea.position.y=-0.6;scene.add(sea);FX.sea=sea;

}

function okSpot(x,z,pad){if(Math.hypot(x,z)>WORLD-4)return false;const h=H(x,z);if(h<0.35&&Math.hypot(x,z)>40)return false;if(Math.hypot(x-LAKE.x,z-LAKE.z)<LAKE.r+3)return false;
  if(colliders.some(c=>Math.hypot(c.x-x,c.z-z)<c.r+pad))return false;
  if(Math.hypot(x,z)<15.5)return false;if(Math.abs(x)<14&&z<-6&&z>-27)return false;if(Math.abs(x)<7&&z>2&&z<34)return false;
  for(let i=0;i<6;i++){const ha=houseAng(i);const t=x*Math.sin(ha)+z*Math.cos(ha),off=Math.abs(x*Math.cos(ha)-z*Math.sin(ha));if(t>8&&t<HOUSE_R+6&&off<4)return false;}
  for(const zn of ZONES){if(zn.id==='hub')continue;const d=Math.hypot(zn.x,zn.z),ux=zn.x/d,uz=zn.z/d;const t=x*ux+z*uz,off=Math.abs(x*uz-z*ux);if(t>6&&t<d&&off<5.5)return false;if(Math.hypot(x-zn.x,z-zn.z)<24)return false;}
  return true;}
function scatter(R){
  let n=0,g=0;while(n<40&&g++<1500){const a=R()*Math.PI*2,d=13+R()*29;const x=Math.sin(a)*d,z=Math.cos(a)*d;if(okSpot(x,z,2.4)){TREES.push([x,z,0.8+R()*0.45]);colliders.push({x,z,r:1.0});n++;}}
  n=0;g=0;while(n<330&&g++<6000){const x=(R()*2-1)*WORLD,z=(R()*2-1)*WORLD;if(Math.hypot(x,z)<46)continue;if(okSpot(x,z,2)){const s=0.85+R()*0.7;TREES.push([x,z,s]);if(Math.hypot(x,z)<120)colliders.push({x,z,r:1.0*s});n++;}}
  for(let k=0;k<70;k++){const a=R()*Math.PI*2,d=12+R()*30;const x=Math.sin(a)*d,z=Math.cos(a)*d;if(okSpot(x,z,0.6))FLW.push([x,z,FLOWERC[Math.floor(R()*5)]]);}
  for(let k=0;k<260;k++){const x=(R()*2-1)*WORLD,z=(R()*2-1)*WORLD;if(Math.hypot(x,z)>44&&okSpot(x,z,0.6))FLW.push([x,z,FLOWERC[Math.floor(R()*5)]]);}
  for(let k=0;k<40;k++){const x=(R()*2-1)*WORLD,z=(R()*2-1)*WORLD;if(Math.hypot(x,z)>16&&okSpot(x,z,1)){ROCKS.push([x,z,0.6+R()*0.8]);colliders.push({x,z,r:0.9});}}
}
function plantInstances(){
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),v=new THREE.Vector3(),sc=new THREE.Vector3(),col=new THREE.Color();const greens=['#5bb34a','#6cc457','#4fa645'];
  const n=TREES.length,trunk=new THREE.InstancedMesh(new THREE.CylinderGeometry(0.28,0.36,2,7),M('#8a6a48'),n),
    can1=new THREE.InstancedMesh(new THREE.SphereGeometry(1.5,12,9),new THREE.MeshToonMaterial({gradientMap:GRAD}),n),can2=new THREE.InstancedMesh(new THREE.SphereGeometry(1.1,10,8),new THREE.MeshToonMaterial({gradientMap:GRAD}),n);
  TREES.forEach(([x,z,s],i)=>{const y=H(x,z);sc.set(s,s,s);trunk.setMatrixAt(i,m.compose(v.set(x,y+s,z),q,sc));can1.setMatrixAt(i,m.compose(v.set(x,y+2.7*s,z),q,sc));can2.setMatrixAt(i,m.compose(v.set(x+0.6*s,y+3.5*s,z+0.2*s),q,sc));
    col.set(greens[i%3]);can1.setColorAt(i,col);can2.setColorAt(i,col);});
  can1.instanceColor.needsUpdate=can2.instanceColor.needsUpdate=true;
  const fl=FLW.length,bl=new THREE.InstancedMesh(new THREE.SphereGeometry(0.3,8,6),new THREE.MeshToonMaterial({gradientMap:GRAD}),fl),ce=new THREE.InstancedMesh(new THREE.SphereGeometry(0.11,6,5),M('#f8d454'),fl),st=new THREE.InstancedMesh(new THREE.CylinderGeometry(0.03,0.03,0.4,4),M('#4fa645'),fl);
  const flat=new THREE.Vector3(1,0.45,1),one=new THREE.Vector3(1,1,1);
  FLW.forEach(([x,z,c],i)=>{const y=H(x,z);bl.setMatrixAt(i,m.compose(v.set(x,y+0.45,z),q,flat));bl.setColorAt(i,col.set(c));ce.setMatrixAt(i,m.compose(v.set(x,y+0.53,z),q,one));st.setMatrixAt(i,m.compose(v.set(x,y+0.2,z),q,one));});
  bl.instanceColor.needsUpdate=true;
  const rk=new THREE.InstancedMesh(new THREE.DodecahedronGeometry(0.8,0),M('#c9c2b2'),ROCKS.length);
  ROCKS.forEach(([x,z,s],i)=>{rk.setMatrixAt(i,m.compose(v.set(x,H(x,z)+0.2*s,z),q,sc.set(s,s*0.7,s)));});
  [trunk,can1,can2,rk].forEach(o=>{o.castShadow=o.receiveShadow=true;scene.add(o);});[bl,ce,st].forEach(o=>{o.receiveShadow=true;scene.add(o);});
}

const EYE=new THREE.MeshBasicMaterial({color:'#3b2f24'});const BLUSH=new THREE.MeshBasicMaterial({color:'#ffb2a6',transparent:true,opacity:.8});
function chibi(color,k,opt={}){
  const root=new THREE.Group();const g=new THREE.Group();root.add(g);
  const skin=SKINS[k%6],hair=opt.hair||HAIRS[k%6];
  const legs=[-0.2,0.2].map(x=>{const p=new THREE.Group();p.position.set(x,0.5,0);p.add(mesh(new THREE.CylinderGeometry(0.13,0.15,0.5,8),'#6e583d',0,-0.25,0));g.add(p);return p;});
  g.add(mesh(new THREE.CylinderGeometry(0.42,0.52,0.85,14),color,0,0.88,0));
  g.add(mesh(new THREE.SphereGeometry(0.42,14,10),color,0,1.28,0));
  const arms=[-1,1].map(s=>{const p=new THREE.Group();p.position.set(s*0.5,1.2,0);p.add(mesh(new THREE.SphereGeometry(0.17,10,8),skin,0,-0.38,0));p.add(mesh(new THREE.CylinderGeometry(0.11,0.13,0.4,8),color,0,-0.15,0));g.add(p);return p;});
  const head=new THREE.Group();head.position.y=2.15;g.add(head);
  head.add(mesh(new THREE.SphereGeometry(0.78,22,18),skin));
  const hr=mesh(new THREE.SphereGeometry(0.82,22,14,0,Math.PI*2,0,Math.PI*0.5),hair,0,0.06,-0.04);hr.rotation.x=-0.45;head.add(hr);
  const bang=mesh(new THREE.SphereGeometry(0.5,14,10,0,Math.PI*2,0,Math.PI*0.4),hair,0,0.44,0.38);bang.rotation.x=0.9;head.add(bang);
  [-0.27,0.27].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(0.085,10,8),EYE);e.position.set(x,0.02,0.72);e.scale.set(1,1.5,0.6);head.add(e);
    const b=new THREE.Mesh(new THREE.CircleGeometry(0.12,12),BLUSH);b.position.set(x*1.45,-0.18,0.69);b.rotation.y=x*0.6;head.add(b);});
  if(opt.hat){head.add(mesh(new THREE.CylinderGeometry(0.55,0.75,0.35,16),opt.hat,0,0.72,0),mesh(new THREE.CylinderGeometry(1.05,1.05,0.06,20),opt.hat,0,0.56,0));}
  if(opt.glasses){[-0.27,0.27].forEach(x=>{const r=new THREE.Mesh(new THREE.TorusGeometry(0.17,0.035,6,18),EYE);r.position.set(x,0.03,0.76);head.add(r);});const br=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.03,0.03),EYE);br.position.set(0,0.06,0.79);head.add(br);}
  const sh=new THREE.Mesh(new THREE.CircleGeometry(0.7,20),new THREE.MeshBasicMaterial({color:0x3b2f24,transparent:true,opacity:.16,depthWrite:false}));sh.rotation.x=-Math.PI/2;sh.position.y=0.03;root.add(sh);
  root.traverse(o=>{if(o.isMesh)o.castShadow=!(o.material===EYE||o.material===BLUSH||o===sh);});
  return {root,g,head,legs,arms,walk:0,talk:0};
}
function animChar(ch,dt,moving,t,run){
  ch.walk+=dt*(moving?(run?15:11):0);const s=moving?Math.sin(ch.walk):0;
  ch.legs[0].rotation.x=s*0.7;ch.legs[1].rotation.x=-s*0.7;ch.arms[0].rotation.x=-s*0.6;ch.arms[1].rotation.x=s*0.6;
  ch.g.position.y=moving?Math.abs(Math.sin(ch.walk))*0.12:Math.sin(t*2+ch.root.id)*0.03;
  if(ch.talk>0){ch.talk-=dt;ch.head.rotation.z=Math.sin(t*14)*0.08;ch.arms[1].rotation.z=0.6+Math.sin(t*10)*0.3;}else{ch.head.rotation.z*=0.9;ch.arms[1].rotation.z*=0.9;}
}

function resultOf(co,pick,r,mine){
  const rd=ROUNDS[r];if(!pick)return {sc:0,cap:0,txt:'還在思考'};
  if(pick.res&&!mine)return pick.res;
  if(pick.kind==='risk'){const d=rd.data[co];const ok=pick.ch.includes(d.best);return {sc:ok?1:0,cap:0,ok,txt:pick.ch.length?`選了${pick.ch.map(k=>d.opts[k].s).join('、')}`:'時間到，沒有選說'};}
  if(pick.kind==='coop'){if(!pick.partner)return {sc:0,cap:0,txt:'這回合沒有合作'};
    let g=rd.grades[pairKey(co,pick.partner)];if(pick.up)g=upG(g);const tot=Math.min(12,(pick.bet||1)+(pick.pbet||1));const extra=EXTRA[g][Math.max(0,tot-2)];
    let sc=(g==='S'||g==='A')?1:0,med=false;if(!sc&&g==='B'&&co==='med'&&mine&&!S.advUsed){sc=1;med=true;}
    return {sc,cap:extra,g,ok:sc>0,med,txt:`和${coOf(pick.partner).short}合作・${g} 級${pick.up?'（綠電升級）':''}・綜效 +${extra}`};}
  if(pick.kind==='invest'){if(pick.plan<0||pick.plan==null)return {sc:0,cap:0,txt:'保留資本，不投資'};const p=rd.plans[co][pick.plan];const ok=pick.guess===p.ans;
    return {sc:ok?p.pts:0,cap:ok?-p.cost:-p.cost+p.refund,ok,txt:`買${p.cost} 資本方案，判斷是${pick.guess}`};}
  return {sc:0,cap:0,txt:''};
}
/* 電腦代打：用房號＋回合當亂數種子，同一房間每台電腦算出來一樣 */
function simBots(r){for(let k=S.botsDone+1;k<=r;k++)simRound(k);if(r>S.botsDone)S.botsDone=r;}
function simRound(k){
  const rd=ROUNDS[k];if(!rd)return;const others=COMP.map(c=>c.id).filter(id=>id!==S.co);const out={};
  others.forEach(co=>{S.bots[co]=S.bots[co]||{cap:6,sc:0};});
  if(rd.type==='risk')others.forEach(co=>{const R=rng(S.room+'|'+k+'|'+co);const d=rd.data[co];const ok=R()<0.45;const alt=d.opts.map((o,j)=>j).filter(j=>j!==d.best);out[co]={kind:'risk',ch:[ok?d.best:alt[Math.floor(R()*alt.length)]]};});
  if(rd.type==='invest')others.forEach(co=>{const R=rng(S.room+'|'+k+'|'+co);const b=S.bots[co];let plan=-1;if(b.cap>=8&&R()<0.45)plan=1;else if(b.cap>=5&&R()<0.8)plan=0;
    const p=plan>=0?rd.plans[co][plan]:null;out[co]={kind:'invest',plan,guess:p?(R()<0.5?p.ans:SHUO9[Math.floor(R()*9)]):null};});
  if(rd.type==='coop'){const fixed={};const add=(a,pk)=>{if(pk&&pk.kind==='coop'&&pk.partner&&!fixed[pk.partner])fixed[pk.partner]={kind:'coop',partner:a,bet:pk.pbet,pbet:pk.bet,up:pk.up};};
    add(S.co,S.picks[k]);Object.values(players).forEach(p=>{if(p&&p.co&&p.co!==S.co&&p.picks)add(p.co,p.picks[k]);});
    const free=others.filter(co=>!fixed[co]&&!humanAny(co));const R=rng(S.room+'|pair|'+k);free.sort(()=>R()-0.5);
    for(let j=0;j+1<free.length;j+=2){const a=free[j],b=free[j+1];const ba=Math.max(1,Math.min(S.bots[a].cap,1+Math.floor(R()*6))),bb=Math.max(1,Math.min(S.bots[b].cap,1+Math.floor(R()*6)));
      out[a]={kind:'coop',partner:b,bet:ba,pbet:bb};out[b]={kind:'coop',partner:a,bet:bb,pbet:ba};}
    others.forEach(co=>{if(!out[co])out[co]=fixed[co]||{kind:'coop',partner:null};});}
  for(const co of others){const res=resultOf(co,out[co],k,false);out[co].res=res;S.bots[co].cap+=res.cap;S.bots[co].sc+=res.sc;}
  S.botPick[k]=out;
}

  const rows=COMP.filter(c=>c.id!==S.co).map(c=>{const h=humanAny(c.id);let pk,rs,who;
    if(h){pk=h.picks&&h.picks[r];rs=pk?resultOf(c.id,pk,r,false):{txt:'還在思考',sc:0};who=h.nick||'真人';}else{pk=S.botPick[r][c.id];rs=pk.res;who='電腦代打';}
    return `<div class="row"><span class="dot" style="background:${c.color}"></span><span>${c.name}<small>${esc(who)}・${esc(rs.txt||'')}</small></span><span class="pts">${rs.sc?'+'+rs.sc:'0'} 分</span></div>`;}).join('');
  await card({top:`第 ${r+1} 回合亮牌・${rd.title}`,title:head},rCol(rd),`<div class="res"><span class="big" style="background:${res.sc?'#79c652':'#c9b994'}">${rd.type==='coop'&&pick.partner?res.g:res.sc?'✓':'—'}</span><div>${chips}</div></div>${detail}<h3>其他公司同時亮牌</h3><div class="rows">${rows}</div>`,[[r<ROUNDS.length-1?`前往第 ${r+2} 回合`:'看最終結果','next']]);
  S.round++;push({round:S.round});hud();
  if(S.round>=ROUNDS.length)ending();else beginRound();
}

/* 排行與結局 */
function standings(){const list=COMP.map(c=>{if(c.id===S.co)return {c,who:S.nick+'（你）',sc:S.sc,cap:S.cap,me:true};const h=humanAny(c.id);if(h)return {c,who:h.nick||'真人',sc:h.sc||0,cap:h.cap??6};const b=S.bots[c.id]||{sc:0,cap:6};return {c,who:'電腦代打',sc:b.sc,cap:b.cap};});
  return list.sort((a,b)=>b.sc-a.sc||b.cap-a.cap);}
const stars=n=>'★'.repeat(n)+`<s>${'★'.repeat(5-n)}</s>`;
async function ending(){S.phase='end';refreshWorld();simBots(ROUNDS.length-1);FX.focus={x:-1.5,z:-5};
  const st=standings();const avg=st.reduce((a,x)=>a+x.sc,0)/st.length;const isl=Math.max(1,Math.min(5,Math.round(avg/2)));const mine=Math.max(1,Math.min(5,Math.ceil(S.sc/2)));
  const top=st[0].sc;const winners=st.filter(x=>x.sc===top).map(x=>x.c.name);
  await talk('主持人 阿綠',HOSTC,['八回合結束了！大家辛苦了。',`這次策略分最高的是：${winners.join('、')}，${top} 分！`,`整座園區的平均是 ${avg.toFixed(1)} 分，園區評價 ${isl} 顆星。`]);
  const v=await card({top:'八回合結算・滿分 10 分',title:winners.includes(coOf(S.co).name)?'你們是最強的新創！':`${winners.join('、')} 獲勝`},HOSTC,
   `<div class="res"><div><div class="stars">${stars(mine)}</div><p>你的公司：<b>${S.sc} 分</b>・剩 ${S.cap} 資本</p></div></div>
    <div class="note">園區評價 <span class="stars" style="font-size:20px">${stars(isl)}</span><br>六家平均 ${avg.toFixed(1)} 分。分數看的是每回合有沒有選對策略邏輯：3.0 重知識與效率，4.0 重信任、共生與治理。</div>
    <h3>最終排行</h3><div class="rows">${st.map((x,i)=>`<div class="row ${x.me?'me':''}"><span class="dot" style="background:${x.c.color}"></span><span>${i+1}. ${x.c.name}<small>${esc(x.who)}・剩 ${x.cap} 資本</small></span><span class="pts">${x.sc} 分</span></div>`).join('')}</div>`,
   [['再玩一次','again'],['留在島上逛逛','stay','ghost']]);
  FX.focus=null;
  if(v==='again'){S.cap=6;S.sc=0;S.round=0;S.picks={};S.advUsed=false;S.bots={};S.botPick={};S.botsDone=-1;S.handledInv={};push({cap:6,sc:0,round:0,advUsed:false,picks:null});hud();beginRound();}
}

/* 園區手機 */
const ICONS={card:'<path d="M5 4h10l4 4v12H5z" fill="#fff"/><path d="M8 11h8M8 14h8M8 17h5" stroke="#20b2a4" stroke-width="1.8" stroke-linecap="round"/>',
 rule:'<path d="M4 5.5c3-1.5 5-1.5 8 0v14c-3-1.5-5-1.5-8 0zM20 5.5c-3-1.5-5-1.5-8 0v14c3-1.5 5-1.5 8 0z" fill="#fff"/>',
 rank:'<path d="M7 4h10v5a5 5 0 0 1-10 0zM10 15h4v3h3v2H7v-2h3z" fill="#fff"/>',
 adv:'<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z" fill="#fff"/>',
 shuo:'<circle cx="12" cy="12" r="8" fill="#fff"/><path d="M12 6v6l4 2" stroke="#ee8a6c" stroke-width="2" stroke-linecap="round"/>',
map:'<path d="M4 6l5-2 6 2 5-2v14l-5 2-6-2-5 2z" fill="#fff"/><path d="M9 4v14M15 6v14" stroke="#5cb8e6" stroke-width="1.6"/>',
 prof:'<circle cx="12" cy="8" r="4" fill="#fff"/><path d="M4 21c0-4.5 3.6-7 8-7s8 2.5 8 7z" fill="#fff"/>',
 snd:'<path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path d="M16 9c1.5 1.5 1.5 4.5 0 6M18.5 7c3 3 3 7 0 10" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>'};
const APPS=[['map','地圖','#5cb8e6'],['prof','思華老師','#4f5a7a'],['card','事件卡','#20b2a4'],['rank','排行','#f0bd2e'],['adv','我的優勢','#ee8a6c'],['shuo','九說小抄','#a454c6'],['rule','規則','#79c652'],['snd','音效','#7ab8e8']];
function togglePhone(on){const el=$('phone');const show=on===undefined?el.hidden:on;if(show&&(uiBusy&&!cardRes))return;
  if(show){if(cardRes)return;unlockMouse();el.hidden=false;phoneHome();}else el.hidden=true;lookHint();}
$('phoneBtn').addEventListener('click',()=>togglePhone());
function showEventCard(){if(S.phase==='lobby'||!S.co||!$('cardWrap').hidden)return;if(!$('phone').hidden)togglePhone(false);
  const r=Math.min(S.round,ROUNDS.length-1),rd=ROUNDS[r];let extra='';
  if(rd.type==='risk'&&rd.data[S.co]&&rd.data[S.co].ctx)extra+=`<div class="note"><b>你的處境：</b>${esc(rd.data[S.co].ctx)}</div>`;
  if(rd.hand)extra+=`<div class="note"><b>你的手卡：</b>${esc(rd.hand[S.co])}</div>`;
  const pk=S.picks&&S.picks[r];if(rd.type==='invest'&&pk&&pk.plan>=0){const p=rd.plans[S.co][pk.plan];extra+=`<div class="note"><b>你買的方案：${esc(p.short)}</b><br>${esc(p.text)}</div>`;}
  card({top:`第 ${r+1} 回合・${TYPENAME[rd.type]}`,title:esc(rd.title)},rCol(rd),`<p style="font-size:17px;line-height:1.8">${esc(rd.event)}</p>${extra}<div class="note">${taskHint()}</div>`,[['知道了','ok']]);}
$('evBtn').addEventListener('click',e=>{e.stopPropagation();showEventCard();});$('phClose').addEventListener('click',()=>{if($('phTitle').textContent!=='園區手機')phoneHome();else togglePhone(false);});
$('phone').addEventListener('click',e=>{if(e.target.id==='phone')togglePhone(false);const tp=e.target.closest('[data-tp]');if(tp){togglePhone(false);teleport(tp.dataset.tp);return;}const a=e.target.closest('[data-app]');if(a)openApp(a.dataset.app);});
function phoneHome(){$('phTitle').textContent='園區手機';$('phClose').textContent='關閉';$('phBody').innerHTML=`<div class="apps">${APPS.map(([k,t,c])=>`<button class="app" data-app="${k}"><i style="background:${c}"><svg viewBox="0 0 24 24">${ICONS[k]}</svg></i>${t}</button>`).join('')}</div>
  <div class="note" style="margin-top:22px">${S.co?`${esc(coOf(S.co).name)}・${esc(S.nick)}<br>第 ${Math.min(S.round+1,8)} / 8 回合・${S.sc} 分・${S.cap} 資本`:''}</div>`;}
function openApp(k){const b=$('phBody');$('phClose').textContent='返回';const set=t=>$('phTitle').textContent=t;
  if(k==='prof'){togglePhone(false);talkProf();return;}
  if(k==='map'){set('地圖・傳送');b.innerHTML=ZONES.map(z=>`<div class="note"><b style="color:${z.color}">${z.name}</b><br>${z.desc}<div class="btns" style="margin-top:8px"><button class="btn" data-tp="${z.id}" style="padding:7px 16px;font-size:14px">傳送到這裡</button></div></div>`).join('');}
  if(k==='card'){set('事件卡');const rd=ROUNDS[Math.min(S.round,7)];b.innerHTML=`<p><b>第 ${Math.min(S.round,7)+1} 回合・${rd.title}</b></p><p>${rd.event}</p>${rd.hand?`<div class="note"><b>你的手卡：</b>${rd.hand[S.co]}</div>`:''}<div class="note">${taskHint()}</div>`;}
  if(k==='rank'){set('排行');simBots(S.round-1);b.innerHTML=`<div class="rows">${standings().map((x,i)=>`<div class="row ${x.me?'me':''}"><span class="dot" style="background:${x.c.color}"></span><span>${i+1}. ${x.c.short}<small>${esc(x.who)}・${x.cap} 資本</small></span><span class="pts">${x.sc} 分</span></div>`).join('')}</div>`;}
  if(k==='adv'){set('我的優勢');const a=ADV[S.co];b.innerHTML=`<div class="note"><b>${a.name}（${a.shuo}）</b><br>${a.text}<br>時機：${a.when}・${S.advUsed?'已經用過':'還沒用'}</div><p>六家的初始優勢都只能用 1 次。合作機會越少的公司，優勢越強，用來補平先天落差。</p>${COMP.filter(c=>c.id!==S.co).map(c=>`<p><b>${c.short}・${ADV[c.id].name}</b>：${ADV[c.id].text}</p>`).join('')}`;}
  if(k==='shuo'){set('九說小抄');b.innerHTML=SHUO9.map(s=>`<p><b style="color:${TH[s].color}">${s}</b>　${TH[s].desc}</p>`).join('');}
  if(k==='rule'){set('規則');b.innerHTML=rulesHTML();}
  if(k==='snd'){S.mute=!S.mute;lsSet('six-mute',S.mute?'1':null);set('音效');b.innerHTML=`<p>音效已${S.mute?'關閉':'開啟'}。</p>`;}
}

/* ───────── 主迴圈 ───────── */
const clock=new THREE.Clock();
let promptNpc=null;
/* 自動畫質：連續 2 秒低於 45 fps 就降一級（先降解析度、再關陰影），只降不升，避免畫面忽好忽壞 */
const Q={lv:0,acc:0,n:0};
function tuneQuality(raw){if(Q.lv>=3||document.hidden)return;Q.acc+=raw;Q.n++;if(Q.acc<2)return;const fps=Q.n/Q.acc;Q.acc=0;Q.n=0;if(fps>=45)return;Q.lv++;
  if(Q.lv===1)renderer.setPixelRatio(1);
  if(Q.lv===2){renderer.shadowMap.enabled=false;scene.traverse(o=>{if(o.material)o.material.needsUpdate=true;});}
  if(Q.lv===3)renderer.setPixelRatio(0.75);
  resize();}
/* 思華老師在廣場外圈散步：沿著守護者圈外走一段、停下來看看，再換方向；玩家靠近或對話時停下 */
const WAND={R:12.4,a:3.75,to:null,wait:2,dir:1};
function wanderProf(dt){const n=NPCS.find(n=>n.id==='prof');if(!n||!n.ch.root.visible)return;n.moving=false;
  const near=Math.hypot(P.x-n.pos.x,P.z-n.pos.z)<3.2;if(near||n.ch.talk>0||uiBusy&&promptNpc===n)return;
  if(WAND.wait>0){WAND.wait-=dt;return;}
  if(WAND.to===null){const R=Math.random;WAND.dir=R()<0.5?-1:1;WAND.to=WAND.a+WAND.dir*(0.6+R()*1.4);}
  const step=dt*1.25/WAND.R;let na=WAND.a+WAND.dir*step;if((WAND.to-na)*WAND.dir<=0){na=WAND.to;WAND.to=null;WAND.wait=3+Math.random()*4;}
  const x=Math.sin(na)*WAND.R,z=GR.cz+Math.cos(na)*WAND.R;
  if(colliders.some(c=>!c.npc&&Math.abs(c.x-x)<c.r+0.3&&Math.hypot(c.x-x,c.z-z)<c.r+0.3)&&!colliders.some(c=>!c.npc&&Math.hypot(c.x-n.pos.x,c.z-n.pos.z)<c.r+0.3)){WAND.dir*=-1;WAND.to=WAND.a+WAND.dir*(0.5+Math.random());return;}
  WAND.a=na;n.pos.x=x;n.pos.z=z;n.col.x=x;n.col.z=z;n.moving=true;
  n.ch.root.position.set(x,H(x,z),z);n.ch.root.rotation.y=Math.atan2(Math.cos(na)*WAND.dir,-Math.sin(na)*WAND.dir);
  if(WAND.to===null)n.ch.root.rotation.y=Math.atan2(-x,GR.cz-z);}
function loop(){
  requestAnimationFrame(loop);
  const raw=clock.getDelta();if(film)return;
  const dt=Math.min(0.05,raw),t=clock.elapsedTime;if(raw<0.5)tuneQuality(raw);
  const moving=stepPlayer(dt);
  if(meCh){meCh.root.position.set(P.x,P.y,P.z);meCh.root.rotation.y=P.ry;animChar(meCh,dt,moving&&P.grounded,t,P.run);plumb.rotation.y=t*1.6;plumb.position.y=4.1+Math.sin(t*2.2)*0.12;}
  for(const id in remote){const r=remote[id];const dx=r.tx-r.x,dz=r.tz-r.z;const mv=Math.hypot(dx,dz)>0.05;r.x+=dx*Math.min(1,dt*8);r.z+=dz*Math.min(1,dt*8);if(mv)r.ry=Math.atan2(dx,dz);r.ch.root.position.set(r.x,H(r.x,r.z),r.z);r.ch.root.rotation.y=r.ry;animChar(r.ch,dt,mv,t);}
  wanderProf(dt);
  NPCS.forEach(n=>{if(n.ch&&n.ch.root.visible)animChar(n.ch,dt,!!n.moving,t);if(n.bang&&n.bang.visible)n.bang.position.y=4.9+Math.abs(Math.sin(t*3+(n.k||0)))*0.35;});
  for(const k in FX.houseBang){const b=FX.houseBang[k];if(b.visible)b.position.y=9.6+Math.abs(Math.sin(t*3))*0.4;}
  ROTORS.forEach((r,i)=>{r.rotation.z=t*(1.1+i*0.07);});
  BEACONS.forEach(b=>{b.cr.rotation.y=t*1.2;b.cr.position.y=b.y+2.2+Math.sin(t*2)*0.2;b.ring.position.y=b.cr.position.y;b.ring.scale.setScalar(1+Math.sin(t*2)*0.06);});
  stepCamera(dt,t);pubPos2(t);
  if(S.phase!=='lobby'&&!uiBusy&&!overlayOpen()){const n=nearest();if(n!==promptNpc){promptNpc=n;$('prompt').hidden=!n;if(n){const act=activeNpc(n);
      $('promptTxt').textContent=n.kind==='house'?(n.co===S.co?'你的公司':act?`拜訪 ${n.name}（邀請合作）`:`看看 ${n.name}`):n.kind==='shuo'?`和 ${ROUNDS[S.round].data[S.co].opts[n.k].s}守護者 說話`:n.kind==='plan'?`聽 方案${'AB'[n.pk]} 的介紹`:
        n.kind==='prof'?'請教 思華老師':n.kind==='board'?'看 規則布告欄':n.kind==='beacon'?'使用 傳送信標':n.kind==='folk'?`和 ${n.name} 聊聊`:'和 主持人 說話';}}}
  else if(promptNpc!==null){promptNpc=null;$('prompt').hidden=true;}
  renderer.render(scene,camera);
}
setInterval(()=>{if(NPCS.length){checkWait();checkIncoming();tickTimer();}},500);
if(/[?&]tab\b/.test(location.search))window.__six={S,P,NPCS,players,talkTo,camera,renderer,ending,hud,scene,Q,CAM,teleport,H,playFilm};
(async()=>{try{await Promise.race([Promise.all([document.fonts.load('44px Huninn'),document.fonts.load('600 20px Fredoka')]),sleep(3500)]);}catch(e){}
  buildWorld();buildNpcs();buildGuardBoards();refreshWorld();loop();})();
(async()=>{renderLobby();await netInit();
  if(db){const last=lsGet('six-room');const q=(location.hash.match(/^#([A-Za-z0-9]{4})$/)||[])[1];const code=(q||last||'').toUpperCase();if(/^[A-Z0-9]{4}$/.test(code))joinRoom(code);}
  renderLobby();})();
})();
</script>
